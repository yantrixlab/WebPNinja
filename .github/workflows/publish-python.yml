name: Publish Python SDK

# Triggered by pushing a tag like "python-v1.0.0". The tag push itself is the
# release approval step — this workflow never runs on its own.
on:
  push:
    tags:
      - "python-v*"

permissions:
  id-token: write # required for PyPI Trusted Publishing (OIDC) — no API token needed

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ".[test]" build
      - run: pytest
      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
