name: Publish Python SDK

# Triggered by pushing a tag like "python-v1.0.0". The tag push itself is the
# release approval step — this workflow never runs on its own.
on:
  push:
    tags:
      - "python-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install ".[test]" build twine
      - run: pytest
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
